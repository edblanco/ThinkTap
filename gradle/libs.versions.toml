robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
core-testing = { group = "androidx.arch.core", name = "core-testing", version.ref = "coreTesting" }
# Turbine is useful for testing flows. Replaces (collect + runBlockingTest)
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbineVer" }
# Mockk has better support for kotlin than mockito
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockkVer" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlinTest" }
kotlin-test-junit = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit", version.ref = "kotlinTest" }
ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4", version.ref = "uiTestCompose" }
ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest", version.ref = "uiTestCompose" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
devtools-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp"}

