name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  ANDROID_PACKAGES: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

jobs:
  jvm-tests:
    name: JVM tests
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: ${{ env.ANDROID_PACKAGES }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Verify SDK independently and publish versioned artifacts
        run: ./sdk/gradlew -p sdk check publish --continue --stacktrace
      - name: Verify isolated JVM consumer against published SDK
        run: ./sdk/gradlew -p sdk/samples/jvm-consumer run --stacktrace
      - name: Run application JVM tests against published SDK artifacts
        run: ./gradlew test --continue --stacktrace
      - name: Upload JVM test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: jvm-test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
            sdk/trivia-sdk-core/build/reports/jacoco/
            **/build/reports/lint-results*
            **/build/reports/detekt/
          retention-days: 14
          if-no-files-found: warn

  screenshot-tests:
    name: Screenshot tests
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: ${{ env.ANDROID_PACKAGES }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Publish SDK artifacts for the application
        run: ./sdk/gradlew -p sdk publish --stacktrace
      - name: Verify all screenshot baselines
        run: ./gradlew verifyRoborazziDebug --continue --stacktrace
      - name: Upload screenshot reports and comparisons
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: screenshot-test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
            **/build/reports/roborazzi/
            **/build/outputs/roborazzi/
            **/src/test/screenshots/
          retention-days: 14
          if-no-files-found: warn

  instrumentation-tests:
    name: Instrumentation tests (API 35)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: ${{ env.ANDROID_PACKAGES }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Publish SDK artifacts for the application
        run: ./sdk/gradlew -p sdk publish --stacktrace
      - name: Enable KVM
        run: |
          echo "CPU virtualization flags: $(grep -cE '(vmx|svm)' /proc/cpuinfo || true)"
          if [ ! -e /dev/kvm ]; then
            echo "::error title=KVM unavailable::/dev/kvm does not exist on this runner (no nested virtualization). Re-run the job to get a different runner."
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          ls -l /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error title=KVM not accessible::/dev/kvm exists but is not readable/writable by $(id -un) after applying the udev rule."
            exit 1
          fi
      - name: Run all instrumentation tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            ./sdk/gradlew -p sdk connectedDebugAndroidTest --continue --stacktrace
            ./gradlew connectedDebugAndroidTest --continue --stacktrace
      - name: Upload instrumentation test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: instrumentation-test-reports-api-35
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
          retention-days: 14
          if-no-files-found: warn
